<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日運勢抽籤器</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#302b3d;background:radial-gradient(circle at 15% 15%,#fff8d9,transparent 30%),radial-gradient(circle at 85% 80%,#e8ddff,transparent 35%),linear-gradient(135deg,#f7efff,#fff1f5)}
.app{width:min(100%,560px);padding:32px;background:#fffdfd;border:1px solid #e9e2f3;border-radius:26px;box-shadow:0 18px 55px #432f6321}
.sparkle{text-align:center;font-size:2rem;margin-bottom:4px}
h1{text-align:center;margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.35rem)}
.subtitle{text-align:center;color:#777184;margin:0 0 24px}
button{width:100%;padding:15px 20px;border:0;border-radius:15px;background:#8064c8;color:white;font:inherit;font-size:1.08rem;font-weight:750;cursor:pointer;transition:.2s}
button:hover{background:#6549ad}button:active{transform:scale(.985)}
button:focus-visible{outline:3px solid #cbb9f2;outline-offset:3px}
.card{margin-top:22px;padding:24px 20px;border:1.5px solid #e9e2f3;border-radius:20px;background:linear-gradient(145deg,#fcf9ff,#fff8fb);text-align:center}
.label{margin:0 0 8px;color:#777184;font-size:.95rem}
#fortune{margin:0 0 18px;color:#6549ad;font-size:clamp(2rem,8vw,2.8rem);font-weight:850;letter-spacing:.08em}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.detail{padding:13px;border-radius:13px;background:white;border:1px solid #eee8f5}
.detail-title{display:block;margin-bottom:5px;color:#777184;font-size:.82rem}
.detail-value{font-weight:750;overflow-wrap:anywhere}
#advice{margin:18px 0 0;padding-top:16px;border-top:1px solid #e9e2f3;line-height:1.7;color:#514960}
.footnote{margin:16px 0 0;color:#777184;text-align:center;font-size:.82rem}
@media(max-width:420px){.app{padding:25px 19px}.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <div class="sparkle" aria-hidden="true">✦ ✧ ✦</div>
  <h1>今日運勢</h1>
  <p class="subtitle">抽一張今日籤，看看今天有什麼好事！</p>
  <button id="drawButton" type="button">抽出今日運勢</button>
  <section class="card" aria-live="polite" aria-atomic="true">
    <p class="label">你的今日運勢是</p>
    <h2 id="fortune">等待抽籤</h2>
    <div class="details">
      <div class="detail"><span class="detail-title">幸運顏色</span><span class="detail-value" id="luckyColor">—</span></div>
      <div class="detail"><span class="detail-title">幸運數字</span><span class="detail-value" id="luckyNumber">—</span></div>
    </div>
    <p id="advice">按下上方按鈕，抽出屬於你的今日小提醒。</p>
  </section>
  <p class="footnote">※ 本抽籤結果僅供娛樂，保持好心情最重要！</p>
</main>
<script>
const fortunes = [
  {level:"大吉",color:"金黃色",number:8,advice:"今天適合把握機會、主動出擊。勇敢踏出一步，可能會有意想不到的收穫！"},
  {level:"上吉",color:"天空藍",number:3,advice:"整體步調順暢，適合完成重要任務。把握專注的時刻，努力會慢慢看見成果。"},
  {level:"中吉",color:"薄荷綠",number:6,advice:"今天適合穩扎穩打。別急著追求速度，按部就班就能讓事情逐漸明朗。"},
  {level:"小吉",color:"櫻花粉",number:2,advice:"生活中可能藏著小小驚喜。多留意身邊的人事物，也別忘了給自己一點鼓勵。"},
  {level:"吉",color:"薰衣草紫",number:7,advice:"保持彈性會讓今天更順利。遇到不同意見時，先聽聽看，或許能得到新靈感。"},
  {level:"平",color:"奶茶棕",number:5,advice:"平穩就是今天的好運。照顧好自己的節奏，完成眼前的小事就很棒了。"},
  {level:"小凶",color:"銀灰色",number:4,advice:"今天做決定前可以多想一下，重要事情記得再次確認。放慢腳步，不必勉強自己。"},
  {level:"轉運中",color:"橘紅色",number:9,advice:"即使一開始不太順利，也別急著否定自己。換個方法試試，轉機可能就在下一步。"}
];

document.getElementById("drawButton").addEventListener("click", () => {
  const result = fortunes[Math.floor(Math.random() * fortunes.length)];
  document.getElementById("fortune").textContent = result.level;
  document.getElementById("luckyColor").textContent = result.color;
  document.getElementById("luckyNumber").textContent = result.number;
  document.getElementById("advice").textContent = result.advice;
});
</script>
</body>
</html>
